<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
   
<header>
    <h1>Pocket Budget Helper</h1>
</header>

<main>

    <!-- Summary -->
     <section class="summary-grid">
        <div class="summary-card">
            <h2>Total Income</h2>
            <p id="total-income">$0.00</p>
        </div>

        <div class="summary-card">
            <h2>Total Expenses</h2>
            <p id="total-expenses">$0.00</p>
        </div>

        <div class="summary-card">
            <h2>Balance</h2>
            <p id="balance">$0.00</p>
        </div> 
     </section>

     <!-- Record Form -->
     <section>
        <h2>Add New Record</h2>

        <form id="record-form">
            <label>
                Type
                <select name="type" id="record-type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </label>

            <label>
                Amount
                <input 
                type="number"
                id="amount"
                min="0"
                step="0.01"
                required>
            </label>
        
            <label>
                Catergory
                <select name="category" id="category">
                    <option value="">Select Category</option>
                    <option value="food">Food</option>
                    <option value="transportation">Transportation</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="school">School</option>
                    <option value="bills">Bills</option>
                    <option value="work">Work</option>
                    <option value="other">Other</option>
                </select>
</label>
                <label>
                    Date
                    <input
                    type="date"
                    id="date"
                    required>
                </label>
            

            <label>
                Note
                <input
                `type="text"
                id="note"
                placeholder="Short note"
                >
            </label>

            <button type="submit">
            Add Record
            </button>

        </form>
     </section>

     <!-- Filter and Sort -->
     <section class="record-controls">
        <select name="filter" id="filter-type">
            <option value="all">All Records</option>
            <option value="income">Income</option>
            <option value="expense">Expenses</option>
        </select>

        <select name="sort" id="sort-records">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="highest">Highest Amount</option>
            <option value="lowest">Lowest Amount</option>
        </select>

        <input 
        type="search"
        id="search-records"
        placeholder="Search records..."> 

     </section>

     <!-- Records List -->
      <section>
        <h2>Recent Records</h2>

        <div id="record-list">
            <p>No records yet.</p>
        </div>
      </section>

      <!-- Category Summary -->
       <section>
        <h2>Spending by Category</h2>

        <div id="category-summary"></div>
       </section>

</main>
<!-- javascript link connection -->
<script src="js/script.js"></script>

</body>
</html>
